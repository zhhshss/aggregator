name: TURN scan (public minutes)

# 公开仓库的标准 GitHub-hosted runner 不消耗私有仓库的 Actions 分钟。
# 代码通过只读 Deploy Key 从私有仓库拉取；工作流日志不输出 TURN 凭据。
on:
  schedule:
    # TURN 候选发现与完整中继扫描每天一次；现有可用性/测速任务仍每 3 小时运行。
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      concurrency:
        description: "扫描并发"
        required: false
        default: "100"
      query:
        description: "覆盖 FOFA 查询（留空使用默认查询）"
        required: false
        default: ""

concurrency:
  group: turn-scan-public
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.TURN_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.TURN_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.TURN_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.TURN_R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ secrets.TURN_R2_PUBLIC_BASE }}
      R2_PREFIX: turn/
      FOFA_BASE: https://fofa-gw.ciallo0d000721.cc.cd
      FOFA_TOKEN: ${{ secrets.TURN_FOFA_TOKEN }}
      XUDP_HOST: udp.ciallo0d000721.cc.cd
      XUDP_UUID: ${{ secrets.TURN_XUDP_UUID }}
      XHTTP_HOST: xturn.ciallo0d000721.cc.cd
      XHTTP_ENTRY: xturn.ciallo0d000721.cc.cd
      XHTTP_UUID: ${{ secrets.TURN_XHTTP_UUID }}

    steps:
      - name: Checkout private scanner source
        uses: actions/checkout@v4
        with:
          repository: zhhshss/fofa-cf-snippet
          ssh-key: ${{ secrets.TURN_PRIVATE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in \
            R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET \
            FOFA_TOKEN XUDP_UUID XHTTP_UUID; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required secret: $key" >&2
              exit 1
            fi
          done

      - name: Build scanner
        run: go build -o turn_scan turn_scan.go

      - name: Export and merge candidates
        env:
          FOFA_QUERY: ${{ github.event.inputs.query }}
        shell: bash
        run: |
          set -euo pipefail
          # 先回灌上次可用节点。FOFA 临时不可用时仍能完成存量复检，
          # 避免一次外部网关故障让整个每日扫描直接失败。
          : > turn_candidates.txt
          python3 scripts/merge_turn_candidates.py \
            --report "$R2_PUBLIC_BASE/turn/turn_report.json" \
            --input turn_candidates.txt \
            --output turn_candidates.txt \
            || echo "Previous report unavailable; relying on fresh candidates"
          cp turn_candidates.txt previous_turn_candidates.txt

          : > fresh_turn_candidates.txt
          # FOFA 发现是增量来源，不应独占整个 45 分钟任务。给它 8 分钟硬上限；
          # 超时或网关故障时直接复检上次可用节点，确保扫描与发布仍能完成。
          export_status=0
          if [[ -n "${FOFA_QUERY:-}" ]]; then
            timeout 8m python3 scripts/fofa_export_bulk.py -q "$FOFA_QUERY" \
              --countries '' --days 90 --window-days 30 --limit 4000 \
              -o fresh_turn_candidates.txt --json turn_candidates.json \
              || export_status=$?
          else
            timeout 8m python3 scripts/fofa_export_bulk.py --preset turn \
              --countries SG,JP,KR,HK,TW --days 90 --window-days 30 --limit 4000 \
              -o fresh_turn_candidates.txt --json turn_candidates.json \
              || export_status=$?
          fi

          cat previous_turn_candidates.txt fresh_turn_candidates.txt \
            | sort -u > turn_candidates.txt

          if (( export_status != 0 )); then
            echo "FOFA export unavailable or timed out; scanning retained TURN candidates" >&2
          fi
          test -s turn_candidates.txt

      - name: Scan and publish to R2
        env:
          SCAN_CONCURRENCY: ${{ github.event.inputs.concurrency || '100' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! ./turn_scan -c "$SCAN_CONCURRENCY" -p 400 -pt 3 -t 5 -ct 8 \
            turn_candidates.txt > /tmp/turn-scan.log 2>&1; then
            echo "TURN scan failed; sanitized tail follows" >&2
            tail -n 100 /tmp/turn-scan.log \
              | sed -E \
                -e 's/(WEAK|CRED)\([^)]*\)/\1(REDACTED)/g' \
                -e 's/\([^()[:space:]]+:[^()[:space:]]+\)/(REDACTED)/g' \
              >&2
            exit 1
          fi

      - name: Build and publish XHTTP subscription
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q boto3 botocore
          python3 scripts/turn_xhttp_sub.py > /tmp/xhttp-sub.log 2>&1

      - name: Safe summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          print("## TURN scan (public runner)")
          report = Path("turn_report.json")
          if not report.exists():
              print("\n- No report produced")
              raise SystemExit
          data = json.loads(report.read_text(encoding="utf-8"))
          print(f"\n- Total candidates: {data.get('total', 0)}")
          print(f"- Usable: {data.get('usable', 0)}")
          print(f"- ALL: {data.get('all_count', 0)}")
          print(f"- Updated: {data.get('updated_at', 'unknown')}")
          PY
