name: Find CN2 proxies

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      zip_url:
        description: "CF 反代 IP zip 下载地址"
        required: false
        default: "https://zip.cm.edu.kg/ip.zip"
      regions:
        description: "优先测试的地区代码，逗号分隔"
        required: false
        default: "HK,JP,SG,TW,KR,US,GB,DE,NL,FR"
      max_candidates:
        description: "百度前置测试上限（0=地区内全部）"
        required: false
        default: "0"
      max_traces:
        description: "回程追踪上限（0=全部可用候选）"
        required: false
        default: "60"
      trace_concurrency:
        description: "并发路由追踪数"
        required: false
        default: "20"
      port:
        description: "只提取该端口目录"
        required: false
        default: "443"

concurrency:
  group: find-cn2-proxies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
      GLOBALPING_PROXY_POOL: ${{ secrets.GLOBALPING_PROXY_POOL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest CF proxy IPs
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url || 'https://zip.cm.edu.kg/ip.zip' }}
          REGIONS: ${{ github.event.inputs.regions || 'HK,JP,SG,TW,KR,US,GB,DE,NL,FR' }}
          PORT: ${{ github.event.inputs.port || '443' }}
        run: |
          python -u scripts/fetch_cf_ips.py \
            --zip-url "$ZIP_URL" \
            --port "$PORT" \
            --regions "$REGIONS" \
            --output Global-proxyip-443.csv \
            --timeout 30

      - name: Prepare Globalping proxy pool
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$GLOBALPING_PROXY_POOL" ]; then
            printf '%s\n' "$GLOBALPING_PROXY_POOL" > "$RUNNER_TEMP/globalping-proxies.txt"
          else
            : > "$RUNNER_TEMP/globalping-proxies.txt"
          fi

      - name: Find CN2 proxies
        id: scan
        continue-on-error: true
        env:
          REGIONS: ${{ github.event.inputs.regions || 'HK,JP,SG,TW,KR,US,GB,DE,NL,FR' }}
          MAX_CANDIDATES: ${{ github.event.inputs.max_candidates || '0' }}
          MAX_TRACES: ${{ github.event.inputs.max_traces || '60' }}
          TRACE_CONCURRENCY: ${{ github.event.inputs.trace_concurrency || '20' }}
        run: |
          python -u scripts/find_cn2.py \
            --input Global-proxyip-443.csv \
            --output-dir cn2 \
            --regions "$REGIONS" \
            --max-candidates "$MAX_CANDIDATES" \
            --max-traces "$MAX_TRACES" \
            --trace-concurrency "$TRACE_CONCURRENCY" \
            --globalping-proxy-file "$RUNNER_TEMP/globalping-proxies.txt"

      - name: Save emergency progress artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cn2-progress-${{ github.run_id }}
          path: cn2/progress.csv
          if-no-files-found: warn

      - name: Upload report artifact
        if: ${{ steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cn2-proxies-${{ github.run_id }}
          path: cn2/
          if-no-files-found: error

      - name: Publish latest report
        if: ${{ steps.scan.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cn2/
          if git diff --cached --quiet; then
            echo "CN2 report unchanged"
            exit 0
          fi
          git commit -m "chore: update CN2 proxy report"
          for attempt in 1 2 3; do
            if git fetch origin main; then
              git show "origin/main:cn2/progress.csv" > "$RUNNER_TEMP/remote-progress.csv" \
                || : > "$RUNNER_TEMP/remote-progress.csv"
              python scripts/merge_cn2_progress.py \
                --local "cn2/progress.csv" \
                --remote "$RUNNER_TEMP/remote-progress.csv" \
                --output-dir "cn2"
              git reset --soft origin/main
              git add cn2/
              if git diff --cached --quiet; then
                exit 0
              fi
              git commit -m "chore: update CN2 proxy report"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish attempt $attempt failed; retrying" >&2
            sleep $((attempt * 3))
          done
          exit 1

      - name: Publish emergency progress
        if: ${{ steps.scan.outcome != 'success' && hashFiles('cn2/progress.csv') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cn2/progress.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: checkpoint CN2 scan progress"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Checkpoint attempt $attempt failed; retrying" >&2
            sleep $((attempt * 3))
          done
          exit 1

      - name: Fail if scan failed
        if: ${{ steps.scan.outcome != 'success' }}
        run: exit 1
