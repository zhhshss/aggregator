name: Speedtest CN2 GT proxies

on:
  workflow_dispatch:
    inputs:
      bytes:
        description: "每个 IP 下载字节数"
        required: false
        default: "262144"
      concurrency:
        description: "并发测速数"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  speedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Speedtest all CN2 GT proxies
        env:
          TEST_BYTES: ${{ github.event.inputs.bytes || '262144' }}
          TEST_CONCURRENCY: ${{ github.event.inputs.concurrency || '10' }}
        run: |
          python -u "scripts/speedtest_cn2_gt.py" \
            --input "cn2/progress.csv" \
            --output-dir "cn2-speedtest" \
            --bytes "$TEST_BYTES" \
            --concurrency "$TEST_CONCURRENCY"

      - name: Upload speedtest report
        uses: actions/upload-artifact@v4
        with:
          name: cn2-gt-speedtest-${{ github.run_id }}
          path: cn2-speedtest/
          retention-days: 14
          if-no-files-found: error

      - name: Publish speedtest report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cn2-speedtest/"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update CN2 GT speedtest"
          git pull --rebase origin main
          git push origin HEAD:main
